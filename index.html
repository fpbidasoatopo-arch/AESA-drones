function vResultado() {
  const ok = quiz.respuestas.filter((r) => r.bien).length;
  const total = quiz.preguntas.length;
  const p = Math.round((ok / total) * 100);
  const aprobado = p >= 75;

  const porTema = {};
  quiz.respuestas.forEach((r) => {
    if (!porTema[r.tema]) porTema[r.tema] = { n: 0, ok: 0 };
    porTema[r.tema].n++;
    if (r.bien) porTema[r.tema].ok++;
  });
  const temas = Object.keys(porTema)
    .map((t) => ({ t, n: porTema[t].n, ok: porTema[t].ok, pc: Math.round((porTema[t].ok / porTema[t].n) * 100) }))
    .sort((a, b) => a.pc - b.pc);
  const flojos = temas.filter((x) => x.pc < 75);
  const fallos = quiz.respuestas.filter((r) => !r.bien);

  return `
  <div class="card" style="margin-top:18px">
    <div class="verd" data-ok="${aprobado ? 1 : 0}">${aprobado ? "Aprobado" : "No superado"}</div>
    <div class="big" style="margin-top:6px">${ok}/${total}</div>
    <div class="tag" style="margin-top:6px">${p}% · el mínimo son 75 puntos porcentuales${quiz.seg === 0 ? " · se agotó el tiempo" : ""}</div>
    <div class="bar" style="margin-top:14px"><div class="fill" style="width:${p}%"></div><span class="bug" style="left:75%"></span></div>
  </div>

  <div class="card">
    <h3>Diagnóstico por materia</h3>
    <div class="diag">
      ${temas
        .map(
          (x) => `<div class="diagit">
            <div class="diagtop"><b>${esc(x.t)}</b><span>${x.ok}/${x.n}</span></div>
            <div class="diagbar"><i style="width:${x.pc}%;background:${x.pc >= 75 ? "var(--ok)" : x.pc >= 50 ? "var(--am)" : "var(--no)"}"></i></div>
          </div>`
        )
        .join("")}
    </div>
    ${
      flojos.length
        ? `<p class="note">Practica solo la materia que falla:</p><div>${flojos
            .map((x) => `<button class="chip" data-a="tema" data-v="${esc(x.t)}">${esc(x.t)}</button>`)
            .join("")}</div>`
        : ""
    }
  </div>

  ${
    fallos.length
      ? `<div class="card"><h3>Lo que has fallado</h3>
          ${fallos
            .map(
              (r) => `<div style="margin-top:16px">
                <div class="qtema">${esc(r.tema)}</div>
                <div style="font-size:15px;margin:4px 0 6px;line-height:1.4">${esc(Q[r.id].q)}</div>
                <div style="font-size:14.5px;color:var(--ok)">${esc(r.buena)}</div>
                <div class="exp" style="margin-top:8px">${esc(Q[r.id].e)}</div>
              </div>`
            )
            .join("")}
        </div>`
      : ""
  }

  <button class="btn" data-a="${quiz.modo === "examen" ? "examen" : "practica"}">Repetir con preguntas nuevas</button>
  <button class="btn quiet" data-a="salir">Salir del test</button>`;
}

function vRepaso() {
  const todas = idsDe(S.track);
  const vistas = todas.filter((i) => S.prog[i]).length;
  if (!vistas)
    return `<div class="empty">Aquí aparecerán las preguntas que te toca repasar.<br>Cada vez que aciertas una, tarda más en volver: al día siguiente, a los tres días, a la semana, a las dos semanas y al mes.<br>Empieza con un test y esto se irá llenando solo.</div>`;

  const pend = pendientesDe(S.track);
  const dom = todas.filter((i) => S.prog[i] && S.prog[i].n >= 4).length;

  return `
  <div class="card" style="margin-top:16px">
    <h3>${pend.length ? pend.length + " preguntas te tocan hoy" : "Nada pendiente por hoy"}</h3>
    <p class="note" style="margin-top:6px">${
      pend.length
        ? "Son preguntas que fallaste o que ya toca reforzar. Cada acierto las aleja más en el tiempo; cada fallo las devuelve al principio."
        : "Has repasado todo lo que tocaba. Vuelve mañana o sigue avanzando con preguntas nuevas."
    }</p>
    <div class="rows" style="margin-top:12px">
      <div class="row"><b>Dominadas</b><span>${dom} de ${vistas} vistas</span></div>
      <div class="row"><b>Sin ver</b><span>${todas.length - vistas} preguntas del banco</span></div>
    </div>
  </div>
  ${pend.length ? `<button class="btn" data-a="repasar">Repasar ahora</button>` : ""}
  <button class="btn ghost" data-a="practica">Seguir con preguntas nuevas</button>
  ${pend
    .slice(0, 12)
    .map(
      (id) => `<div class="card">
        <div class="qtema">${esc(Q[id].tema)} · nivel ${S.prog[id].n}</div>
        <div style="font-size:15.5px;margin:5px 0 8px;line-height:1.4">${esc(Q[id].q)}</div>
        <div style="font-size:14.5px;color:var(--ok)">${esc(Q[id].o[Q[id].c])}</div>
        <div class="exp" style="margin-top:10px">${esc(Q[id].e)}</div>
      </div>`
    )
    .join("")}
  ${pend.length > 12 ? `<p class="note">Y ${pend.length - 12} más. Haz el repaso para verlas todas.</p>` : ""}`;
}

function vClases() {
  return `
  <div class="card" style="margin-top:16px">
    <h3>Qué puedes volar y dónde</h3>
    <p class="note" style="margin-top:6px">Clasificación por masa y marcado de clase. Es la tabla que más se pregunta, porque cruza tres cosas a la vez: lo que pesa el dron, lo que lleva marcado y lo que acredita el piloto.</p>
    <div class="fig">${DIAGRAMAS.clases.s}<span>${esc(DIAGRAMAS.clases.p)}</span></div>
  </div>

  <div class="card">
    <h3>¿Se puede volar en zona urbana?</h3>
    <p class="note" style="margin-top:6px">No existe un permiso de vuelo urbano como tal. Lo que decide es la combinación de tres cosas: la clase del dron y su subcategoría, la distancia a las personas no participantes, y que la zona geográfica lo permita. Muchos cascos urbanos están además bajo espacio aéreo controlado o tienen restricciones publicadas.</p>
    <div class="fig">${DIAGRAMAS.urbano.s}<span>${esc(DIAGRAMAS.urbano.p)}</span></div>
    <p class="note">Aglomeración es una concentración de personas que no pueden apartarse: una terraza llena, una manifestación, un mercadillo. El sobrevuelo está prohibido en toda la categoría abierta, con cualquier clase de dron.</p>
  </div>

  <div class="card">
    <h3>Distancias: a qué puedo acercarme</h3>
    <div class="fig">${DIAGRAMAS.distancias.s}<span>${esc(DIAGRAMAS.distancias.p)}</span></div>
    ${DISTANCIAS.map((d) => `<div class="dist"><b style="color:var(--${d[2]})">${esc(d[0])}</b><span>${esc(d[1])}</span></div>`).join("")}
  </div>

  <div class="card">
    <h3>¿Puedo volar sobre ese edificio?</h3>
    <div class="fig">${DIAGRAMAS.sobrevuelo.s}<span>${esc(DIAGRAMAS.sobrevuelo.p)}</span></div>
    ${SOBREVUELO.map((d) => `<div class="dist"><b style="color:var(--${d[2]})">${esc(d[0])}</b><span>${esc(d[1])}</span></div>`).join("")}
  </div>
  ${CLASIFICACION.map((c) => `<div class="cls">
      <div class="clshd">
        <b style="color:var(--${c.col})">${esc(c.k)}</b>
        <em>${esc(c.m)}</em>
        <u style="color:var(--${c.col})">${esc(c.cat)}</u>
      </div>
      ${c.f.map((r) => `<div class="clsrow"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join("")}
      ${c.u ? `<div class="urb" data-v="${c.u[0]}"><b>En ciudad</b><span>${esc(c.u[1])}</span></div>` : ""}
    </div>`).join("")}
  <p class="note">Común a toda la categoría abierta: menos de 25 kg, vuelo en VLOS, 120 m de altura sobre el punto más cercano de la superficie, prohibido sobrevolar aglomeraciones, transportar mercancías peligrosas y soltar objetos.</p>`;
}

function vChuleta() {
  return `
  <div class="card" style="margin-top:16px">
    <h3>Las cifras que más caen</h3>
    <p class="note" style="margin-top:6px">Repasa esta pantalla justo antes del examen. Casi todas las preguntas difíciles juegan con estos números.</p>
  </div>
  ${CHULETA.map(
    (b) => `<div class="card"><h3>${esc(b.t)}</h3><table class="tbl"><tbody>
      ${b.f.map((f) => `<tr><td>${esc(f[0])}</td><td>${esc(f[1])}</td></tr>`).join("")}
    </tbody></table></div>`
  ).join("")}
  <p class="note">Última comprobación normativa: septiembre de 2026. Los escenarios nacionales STS-ES-01 y STS-ES-02 dejaron de ser válidos el 31 de diciembre de 2025.</p>`;
}

/* ---------- pintado ---------- */
const VISTAS = { inicio: vInicio, temario: vTemario, test: vTest, repaso: vRepaso, clases: vClases, chuleta: vChuleta };
const NAV = [
  ["inicio", "Inicio", "M3 11 12 4l9 7v9H3z"],
  ["temario", "Temario", "M4 4h11l5 5v11H4z"],
  ["test", "Test", "M5 12l4 4 10-10"],
  ["repaso", "Repaso", "M20 12a8 8 0 1 1-2.3-5.6 M20 4v4h-4"],
  ["clases", "Clases", "M4 6h16 M4 12h16 M4 18h10"],
  ["chuleta", "Chuleta", "M4 5h16v14H4z M8 9h8 M8 13h5"],
];

function pintar() {
  const pend = pendientesDe(S.track).length;
  document.getElementById("seg").innerHTML = Object.keys(TRACKS)
    .map((k) => `<button data-on="${S.track === k ? 1 : 0}" data-a="track" data-v="${k}">${esc(TRACKS[k].nombre)}</button>`)
    .join("");
  document.getElementById("app").innerHTML = VISTAS[S.tab]();
  document.getElementById("nav").innerHTML = NAV.map(
    ([id, txt, d]) => `<button data-on="${S.tab === id ? 1 : 0}" data-a="tab" data-v="${id}">
      ${id === "repaso" && pend ? `<span class="pip">${pend}</span>` : ""}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>${txt}
    </button>`
  ).join("");
  window.scrollTo(0, 0);
}

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-a]");
  if (!b) return;
  const a = b.dataset.a;
  const v = b.dataset.v;
  if (a === "track") {
    S.track = v;
    S.tab = "inicio";
    quiz = null;
    abierto = 0;
    if (tmr) clearInterval(tmr);
    guardar();
    pintar();
  } else if (a === "tab") {
    S.tab = v;
    pintar();
  } else if (a === "acc") {
    abierto = abierto === +v ? -1 : +v;
    pintar();
  } else if (a === "practica") {
    arrancar("practica");
  } else if (a === "examen") {
    arrancar("examen");
  } else if (a === "tema") {
    arrancar("practica", { tema: v, n: 10 });
  } else if (a === "repasar") {
    const p = pendientesDe(S.track);
    arrancar("practica", { ids: p, n: Math.min(20, p.length) });
  } else if (a === "resp") {
    responder(+v);
  } else if (a === "sig") {
    siguiente();
  } else if (a === "salir") {
    quiz = null;
    if (tmr) clearInterval(tmr);
    S.tab = "inicio";
    pintar();
  }
});

pintar();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

</script>
